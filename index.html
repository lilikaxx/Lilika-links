<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Rosa ULTRA</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4da6,#ff99cc);
color:white;
text-align:center;
}

header{
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
width:250px;
}

.botao{
background:white;
color:#ff1493;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

input{
width:90%;
padding:8px;
border-radius:10px;
border:none;
margin-top:10px;
}

.carrinho{
background:white;
color:#ff1493;
padding:20px;
margin:20px auto;
border-radius:20px;
max-width:400px;
}
</style>
</head>

<body>

<header>✨ Loja Rosa ULTRA ✨</header>

<div>
<h3>Adicionar Produto (ADM)</h3>
<input id="nome" placeholder="Nome">
<input id="preco" type="number" placeholder="Preço">
<input id="estoque" type="number" placeholder="Estoque">
<br>
<button class="botao" onclick="criarProduto()">Criar</button>
</div>

<div class="container" id="produtosContainer"></div>

<div class="carrinho">
<h2>Carrinho</h2>
<div id="lista"></div>
<h3>Total R$ <span id="total">0.00</span></h3>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcdKZn5VIIHf23LJzoSvADshLlYhZ3IFo",
  authDomain: "lilika-acessorios.firebaseapp.com",
  projectId: "lilika-acessorios",
  storageBucket: "lilika-acessorios.firebasestorage.app",
  messagingSenderId: "509611122143",
  appId: "1:509611122143:web:5985305e2007398de4786a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// VARIÁVEIS
let total = 0
let itens = []

// LISTAR PRODUTOS (ONLINE)
async function listarProdutos(){

const container = document.getElementById("produtosContainer")
container.innerHTML = ""

const querySnapshot = await getDocs(collection(db, "produtos"))

querySnapshot.forEach((docSnap) => {

let p = docSnap.data()
let id = docSnap.id

container.innerHTML += `
<div class="card">
<h3>${p.nome}</h3>
<p>R$ ${p.preco}</p>
<p>Estoque ${p.estoque}</p>
<button class="botao" onclick="addCarrinho(${p.preco}, '${p.nome}')">Adicionar</button>
<button class="botao" onclick="removerProduto('${id}')">Remover</button>
</div>
`

})

}

// CRIAR PRODUTO (ONLINE)
window.criarProduto = async function(){

let nome = document.getElementById("nome").value
let preco = parseFloat(document.getElementById("preco").value)
let estoque = parseInt(document.getElementById("estoque").value)

if(!nome || !preco || !estoque) return alert("Preencha tudo")

await addDoc(collection(db, "produtos"), {
nome,
preco,
estoque
})

listarProdutos()

}

// REMOVER PRODUTO
window.removerProduto = async function(id){

if(confirm("Remover produto?")){

await deleteDoc(doc(db, "produtos", id))
listarProdutos()

}

}

// CARRINHO
window.addCarrinho = function(preco, nome){

total += preco
itens.push(nome)

document.getElementById("total").innerText = total.toFixed(2)
document.getElementById("lista").innerText = itens.join(", ")

}

// INICIAR
listarProdutos()

</script>

</body>
</html>
