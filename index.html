<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja Rosa ULTRA</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4da6,#ff99cc);
color:white;
text-align:center;
transition:0.4s;
}

body.dark{
backprodutosContainer.iground:linear-gradient(135deg,#111,#333);
}

header{
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
width:250px;
}

.botao{
background:white;
color:#ff1493;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

input,select{
width:90%;
padding:8px;
border-radius:10px;
border:none;
margin-top:10px;
}

.carrinho{
background:white;
color:#ff1493;
padding:20px;
margin:20px auto;
border-radius:20px;
max-width:400px;
}

.admin-btn{
position:fixed;
left:10px;
top:10px;
background:white;
color:#ff1493;
border:none;
border-radius:50%;
width:45px;
height:45px;
cursor:pointer;
z-index:999;
}

.admin-panel{
position:fixed;
left:-100%;
top:0;
width:80%;
max-width:400px;
height:100%;
background:white;
color:#ff1493;
padding:20px;
transition:0.4s;
overflow:auto;
z-index:998;
}

.admin-panel.active{
left:0;
}

.etapa{
display:none;
background:white;
color:#ff1493;
padding:20px;
border-radius:20px;
max-width:400px;
margin:20px auto;
}

</style>
</head>

<body>

<button class="admin-btn" onclick="toggleAdmin()">⚙</button>

<div class="admin-panel" id="adminPanel">

<h3>Painel ADM</h3>

<div id="loginArea">

<input type="password" id="adminKey" placeholder="Digite a Key">

<button class="botao" onclick="verificarKey()">Entrar</button>

<p id="erroKey"></p>

</div>

<div id="adminArea" style="display:none;">

<button class="botao" onclick="toggleTheme()">Tema escuro</button>

<h4>Produtos</h4>

<div id="listaProdutos"></div>

<input id="novoProdutoNome" placeholder="Nome">
<input id="novoProdutoPreco" type="number" placeholder="Preço">
<input id="novoProdutoEstoque" type="number" placeholder="Estoque">
<input id="novoProdutoImagem" placeholder="URL da imagem">
<input id="novoProdutoDescricao" placeholder="Descrição do produto">

<button class="botao" onclick="criarProduto()">Criar Produto</button>

<h4>Cupons</h4>

<div id="listaCupons"></div>

<input id="novoCupom" placeholder="Cupom">
<input id="valorCupom" type="number" placeholder="Valor">

<select id="tipoCupom">
<option value="percent">%</option>
<option value="fixo">R$</option>
</select>

<input id="limiteCupom" type="number" placeholder="Limite">

<button class="botao" onclick="addCupom()">Criar Cupom</button>

<h4>Financeiro</h4>

<p>Total vendas: <span id="totalVendas">0</span></p>
<p>Total faturado: R$ <span id="valorTotalVendido">0.00</span></p>

<h4>Ferramentas</h4>

<button class="botao" onclick="resetarVendas()">Resetar vendas</button>
<button class="botao" onclick="limparCupons()">Limpar cupons</button>
<button class="botao" onclick="exportarDados()">Exportar dados</button>
<button class="botao" onclick="exportarHistorico()">Exportar histórico vendas</button>

</div>
</div>

<header>✨ Loja Rosa ULTRA ✨</header>

<div class="container" id="produtosContainer"></div>

<div class="carrinho">

<h2>Carrinho</h2>

<div id="lista"></div>

<h3>Total R$ <span id="total">0.00</span></h3>

<input id="cupom" placeholder="Cupom">

<button class="botao" onclick="aplicarCupom()">Aplicar</button>
<button class="botao" onclick="abrirEtapa1()">Finalizar</button>

</div>

<div id="etapa1" class="etapa">

<h3>Dados do Cliente</h3>

<input id="nomeCliente" placeholder="Nome completo">
<input id="telefoneCliente" placeholder="Telefone">
<input id="emailCliente" placeholder="Email">

<h3>Endereço</h3>

<input id="cepCliente" placeholder="CEP">
<input id="ruaCliente" placeholder="Rua">
<input id="numeroCasaCliente" placeholder="Número">
<input id="cidadeCliente" placeholder="Cidade">
<input id="estadoCliente" placeholder="Estado">
<input id="complementoCliente" placeholder="Complemento">

<button class="botao" onclick="irParaPagamento()">Continuar</button>

</div>

<div id="etapa2" class="etapa">

<h3>Pagamento PIX</h3>

<h2>R$ <span id="valorFinalPagamento">0.00</span></h2>

<img id="qrCodePix" width="180">

<p>Chave PIX<br>28431707291</p>

<button class="botao" onclick="enviarWhats()">Paguei</button>

</div>

<script type="module">

// 🔥 IMPORTS FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 🔥 CONFIG (A SUA)
const firebaseConfig = {
  apiKey: "AIzaSyBcdKZn5VIIHf23LJzoSvADshLlYhZ3IFo",
  authDomain: "lilika-acessorios.firebaseapp.com",
  databaseURL: "https://lilika-acessorios-default-rtdb.firebaseio.com",
  projectId: "lilika-acessorios",
  storageBucket: "lilika-acessorios.appspot.com",
  messagingSenderId: "509611122143",
  appId: "1:509611122143:web:5985305e2007398de4786a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= VARIÁVEIS =================
let total=0
let itens=[]
let descontoAplicado=0

let produtos=[]
let cupons={}
let totalVendas=0
let valorTotalVendido=0
let historicoVendas=[]

// ================= ADMIN =================
window.toggleAdmin=function(){
adminPanel.classList.toggle("active")
}

window.verificarKey=function(){
let key=adminKey.value

if(key==="HG-HOWBX0" || key==="HG-HWIBZ0"){
loginArea.style.display="none"
adminArea.style.display="block"
carregarProdutos()
listarCupons()
atualizarStats()
}else{
erroKey.innerText="Key incorreta"
}
}

window.toggleTheme=function(){
document.body.classList.toggle("dark")
}

// ================= FIREBASE PRODUTOS =================

async function carregarProdutos(){
produtos=[]
const snapshot = await get(ref(db,"produtos"))

if(snapshot.exists()){
let data = snapshot.val()

Object.keys(data).forEach(id=>{
produtos.push({id,...data[id]})
})
}

listarProdutos()
}

window.criarProduto = async function(){

let nome=novoProdutoNome.value
let preco=parseFloat(novoProdutoPreco.value)
let estoque=parseInt(novoProdutoEstoque.value)

if(!nome||!preco||!estoque)return alert("Preencha tudo")

const novoRef = push(ref(db,"produtos"))

await set(novoRef,{
nome,preco,estoque
})

carregarProdutos()
}

window.removerProduto = async function(i){

if(confirm("Remover produto?")){
await remove(ref(db,"produtos/"+produtos[i].id))
carregarProdutos()
}
}

window.addProdutoCarrinho = async function(i){

let p=produtos[i]

if(p.estoque<=0)return alert("Sem estoque")

p.estoque--

await update(ref(db,"produtos/"+p.id),{
estoque:p.estoque
})

total+=p.preco
itens.push(p.nome)

listarProdutos()
atualizar()
}

// ================= UI =================
window.listarProdutos=function(){

produtosContainer.innerHTML=""
listaProdutos.innerHTML=""

produtos.forEach((p,i)=>{

produtosContainer.innerHTML+=`
<div class="card">

<img src="${p.imagem || 'https://via.placeholder.com/250'}"
style="width:100%; border-radius:15px; margin-bottom:10px;">

<h3>${p.nome}</h3>

<p>R$ ${Number(p.preco).toFixed(2)}</p>

<p style="font-size:14px;">
${p.descricao || "Sem descrição"}
</p>

<p>Estoque ${p.estoque}</p>

<button class="botao" onclick="addProdutoCarrinho(${i})">
Adicionar
</button>

</div>
`

listaProdutos.innerHTML+=`
<div>
${p.nome} - R$ ${p.preco} | Estoque ${p.estoque}
<button class="botao" onclick="removerProduto(${i})">Remover</button>
</div>
`

})

}

// ================= CUPONS (LOCAL MESMO) =================

window.addCupom=function(){
let nome=novoCupom.value
let valor=parseFloat(valorCupom.value)
let tipo=tipoCupom.value
let limite=parseInt(limiteCupom.value)||1

cupons[nome]={valor,tipo,usado:0,limite}
listarCupons()
}

window.listarCupons=function(){
listaCupons.innerHTML=""
for(let c in cupons){
let cup=cupons[c]
listaCupons.innerHTML+=`${c} - ${cup.usado}/${cup.limite}<br>`
}
}

window.aplicarCupom=function(){
let codigo=cupom.value
let cup=cupons[codigo]

if(!cup)return

if(cup.tipo==="percent"){
descontoAplicado=total*(cup.valor/100)
}else{
descontoAplicado=cup.valor
}

cup.usado++
atualizar()
}

// ================= RESTO =================

window.abrirEtapa1=function(){
if(total<=0)return alert("Carrinho vazio")
etapa1.style.display="block"
}

window.irParaPagamento=function(){
let valor=(total-descontoAplicado).toFixed(2)
valorFinalPagamento.innerText=valor
qrCodePix.src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PIX 28431707291 "+valor
etapa1.style.display="none"
etapa2.style.display="block"
}

window.enviarWhats=function(){

let valor=(total-descontoAplicado).toFixed(2)

let nome=nomeCliente.value
let telefone=telefoneCliente.value

let pedido="PED"+Date.now()

let msg=`Pedido ${pedido}

Cliente: ${nome}

Produtos: ${itens.join(", ")}

Valor: R$ ${valor}`

window.location.href="https://wa.me/5592984905651?text="+encodeURIComponent(msg)
}

// ================= INIT =================
carregarProdutos()

</script>

</body>
</html>
