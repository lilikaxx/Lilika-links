<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Rosa Oficial</title>

<style>
body{
margin:0;;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4da6,#ff99cc);
color:white;
text-align:center;
}

header{
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
width:250px;
}

.botao{
background:white;
color:#ff1493;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

input, select{
width:90%;
padding:8px;
border-radius:10px;
border:none;
margin-top:10px;
}

.carrinho{
background:white;
color:#ff1493;
padding:20px;
margin:20px auto;
border-radius:20px;
max-width:400px;
}

/* ADMIN */
.admin-btn{
position:fixed;
left:10px;
top:10px;
background:white;
color:#ff1493;
border:none;
border-radius:50%;
width:45px;
height:45px;
cursor:pointer;
z-index:999;
}

.admin-panel{
position:fixed;
left:-100%;
top:0;
width:80%;
max-width:320px;
height:100%;
background:white;
color:#ff1493;
padding:20px;
transition:0.4s;
overflow:auto;
box-shadow:5px 0 20px rgba(0,0,0,0.3);
border-top-right-radius:20px;
border-bottom-right-radius:20px;
z-index:998;
}

.admin-panel.active{
left:0;
}

.fechar{
background:none;
border:none;
font-size:22px;
color:#ff1493;
cursor:pointer;
float:right;
}

.etapa{
display:none;
background:white;
color:#ff1493;
padding:20px;
border-radius:20px;
max-width:400px;
margin:20px auto;
}
</style>
</head>
<body>

<button class="admin-btn" onclick="toggleAdmin()">⚙</button>

<div class="admin-panel" id="adminPanel">
<button class="fechar" onclick="toggleAdmin()">✖</button>
<h3>Painel ADM</h3>

<div id="loginArea">
<input type="password" id="adminKey" placeholder="Digite a Key">
<button class="botao" onclick="verificarKey()">Entrar</button>
<p id="erroKey"></p>
</div>

<div id="adminArea" style="display:none;">
<button class="botao" onclick="sairAdmin()">Sair</button>

<h4>Criar Cupom</h4>
<input type="text" id="novoCupom" placeholder="Nome do Cupom">
<input type="number" id="valorCupom" placeholder="Valor desconto">
<select id="tipoCupom">
<option value="percent">Desconto %</option>
<option value="fixo">Valor Fixo R$</option>
</select>
<button class="botao" onclick="addCupom()">Criar Cupom</button>

<h4>Cupons</h4>
<div id="listaCupons"></div>

<hr>

<h4>📊 Estatísticas</h4>
<p>Total de vendas: <span id="totalVendas">0</span></p>
<p>Valor total vendido: R$ <span id="valorTotalVendido">0.00</span></p>

<hr>

<h4>👥 Quem usou cupom</h4>
<button class="botao" onclick="limparRegistros()">Limpar Registros</button>
<div id="listaUsuariosCupons"></div>

</div>
</div>

<header>✨ Loja Rosa Oficial ✨</header>

<div class="container">
<div class="card">
<h3>Produto 1</h3>
<p>R$ 49.90</p>
<button class="botao" onclick="add(49.90,'Produto 1')">Adicionar</button>
</div>

<div class="card">
<h3>Produto 2</h3>
<p>R$ 79.90</p>
<button class="botao" onclick="add(79.90,'Produto 2')">Adicionar</button>
</div>
</div>

<div class="carrinho">
<h2>🛒 Carrinho</h2>
<div id="lista"></div>
<h3>Total: R$ <span id="total">0.00</span></h3>

<input type="text" id="cupom" placeholder="Digite seu cupom">
<button class="botao" onclick="aplicarCupom()">Aplicar Cupom</button>
<p id="cupomMsg"></p>

<button class="botao" onclick="abrirEtapa1()">Finalizar Compra</button>
</div>

<div id="etapa1" class="etapa">
<h3>📱 Dados</h3>
<input type="tel" id="telefoneCliente" placeholder="Telefone">
<input type="email" id="emailCliente" placeholder="Email">
<button class="botao" onclick="irParaPagamento()">Avançar</button>
</div>

<div id="etapa2" class="etapa">
<h3>💳 Pagamento PIX</h3>
<h2>R$ <span id="valorFinalPagamento">0.00</span></h2>
<img id="qrCodePix" width="180">
<p><strong>Chave PIX:</strong><br>284-317-072-91</p>
<button class="botao" onclick="enviarWhats()">Paguei ✅</button>
</div>

<script>
let total=0,itens=[],descontoAplicado=0,cupomAplicado=null;
let cupons=JSON.parse(localStorage.getItem("cupons"))||{};
let usuarios=JSON.parse(localStorage.getItem("usuarios"))||[];
let totalVendas=JSON.parse(localStorage.getItem("totalVendas"))||0;
let valorTotalVendido=JSON.parse(localStorage.getItem("valorTotalVendido"))||0;

function toggleAdmin(){document.getElementById("adminPanel").classList.toggle("active");}

function verificarKey(){
if(document.getElementById("adminKey").value==="92973661"){
loginArea.style.display="none"
adminArea.style.display="block";
listarCupons();listarUsuarios();atualizarStats();
}else erroKey.innerText="❌ Key incorreta!";
}

function sairAdmin(){loginArea.style.display="block";adminArea.style.display="none";}

function addCupom(){
let nome=novoCupom.value.trim();
let valor=parseFloat(valorCupom.value);
let tipo=tipoCupom.value;
if(!nome||!valor)return;
cupons[nome]={valor,tipo,usado:false};
localStorage.setItem("cupons",JSON.stringify(cupons));
listarCupons();
}

function listarCupons(){
listaCupons.innerHTML="";
for(let c in cupons){
listaCupons.innerHTML+=`🎟 ${c} - ${cupons[c].usado?"❌":"✅"}<br>`;
}
}

function add(valor,nome){total+=valor;itens.push(nome);atualizar();}

function atualizar(){totalSpan=(total-descontoAplicado).toFixed(2);document.getElementById("total").innerText=totalSpan;lista.innerText=itens.join(", ");}

function aplicarCupom(){
let codigo=cupom.value.trim();
if(cupons[codigo]&&!cupons[codigo].usado){
descontoAplicado=cupons[codigo].tipo==="percent"?total*(cupons[codigo].valor/100):cupons[codigo].valor;
cupons[codigo].usado=true;
cupomAplicado=codigo;
localStorage.setItem("cupons",JSON.stringify(cupons));
atualizar();
cupomMsg.innerText="✅ Cupom aplicado!";
}else cupomMsg.innerText="❌ Cupom inválido ou já usado!";
}

function abrirEtapa1(){if(total<=0)return alert("Adicione produtos!");etapa1.style.display="block";}

function irParaPagamento(){
let tel=telefoneCliente.value.trim();
let email=emailCliente.value.trim();
if(!tel||!email)return alert("Preencha os dados!");
let valor=(total-descontoAplicado).toFixed(2);
valorFinalPagamento.innerText=valor;
qrCodePix.src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PIX 284-317-072-91 VALOR "+valor;
etapa1.style.display="none";etapa2.style.display="block";
}

function enviarWhats(){
let tel=telefoneCliente.value.trim();
let email=emailCliente.value.trim();
let valor=(total-descontoAplicado).toFixed(2);

if(cupomAplicado){
usuarios.push({tel,email,cupom:cupomAplicado,data:new Date().toLocaleString()});
localStorage.setItem("usuarios",JSON.stringify(usuarios));
}

totalVendas++;valorTotalVendido+=parseFloat(valor);
localStorage.setItem("totalVendas",totalVendas);
localStorage.setItem("valorTotalVendido",valorTotalVendido);

let msg=`Nova compra!\nProdutos: ${itens.join(", ")}\nValor: R$ ${valor}\nTelefone: ${tel}\nEmail: ${email}\nCupom: ${cupomAplicado||"Nenhum"}`;
window.location.href="https://wa.me/5592984905651?text="+encodeURIComponent(msg);
}

function listarUsuarios(){
listaUsuariosCupons.innerHTML="";
usuarios.forEach(u=>{
listaUsuariosCupons.innerHTML+=`📞 ${u.tel}<br>📧 ${u.email}<br>🎟 ${u.cupom}<br>📅 ${u.data}<hr>`;
});
}

function atualizarStats(){
totalVendasSpan=document.getElementById("totalVendas");
valorTotalSpan=document.getElementById("valorTotalVendido");
totalVendasSpan.innerText=totalVendas;
valorTotalSpan.innerText=valorTotalVendido.toFixed(2);
}

function limparRegistros(){
usuarios=[];
localStorage.removeItem("usuarios");
listarUsuarios();
}
</script>

</body>
</html>
