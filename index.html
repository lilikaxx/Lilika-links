<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Rosa ULTRA</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff4da6,#ff99cc);
color:white;
text-align:center;
}

header{
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
width:250px;
}

.botao{
background:white;
color:#ff1493;
border:none;
padding:10px;
border-radius:20px;
margin-top:10px;
cursor:pointer;
}

.admin-panel{
position:fixed;
left:-100%;
top:0;
width:80%;
height:100%;
background:white;
color:#ff1493;
padding:20px;
transition:0.4s;
overflow:auto;
}

.admin-panel.active{
left:0;
}
</style>
</head>

<body>

<button onclick="toggleAdmin()">⚙</button>

<div class="admin-panel" id="adminPanel">

<h2>Painel ADM</h2>

<input type="password" id="adminKey" placeholder="Digite a Key">
<button onclick="verificarKey()">Entrar</button>

<div id="adminArea" style="display:none;">

<h3>Produtos</h3>

<input id="nome" placeholder="Nome">
<input id="preco" type="number" placeholder="Preço">
<input id="estoque" type="number" placeholder="Estoque">

<button onclick="criarProduto()">Criar Produto</button>

<div id="listaProdutos"></div>

</div>
</div>

<header>✨ Loja Rosa ULTRA ✨</header>

<div class="container" id="produtos"></div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBcdKZn5VIIHf23LJzoSvADshLlYhZ3IFo",
authDomain: "lilika-acessorios.firebaseapp.com",
projectId: "lilika-acessorios",
storageBucket: "lilika-acessorios.firebasestorage.app",
messagingSenderId: "509611122143",
appId: "1:509611122143:web:5985305e2007398de4786a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const produtosRef = collection(db, "produtos");

window.toggleAdmin = function(){
adminPanel.classList.toggle("active")
}

window.verificarKey = function(){
if(adminKey.value === "HG-HOWBX0"){
adminArea.style.display = "block"
}else{
alert("Key errada")
}
}

window.criarProduto = async function(){

let nome = document.getElementById("nome").value
let preco = parseFloat(document.getElementById("preco").value)
let estoque = parseInt(document.getElementById("estoque").value)

if(!nome || !preco || !estoque) return alert("Preencha tudo")

await addDoc(produtosRef,{
nome,
preco,
estoque
})

alert("Produto criado!")

}

function renderProdutos(lista){

let container = document.getElementById("produtos")
let adminLista = document.getElementById("listaProdutos")

container.innerHTML=""
adminLista.innerHTML=""

lista.forEach(doc =>{

let p = doc.data()

container.innerHTML += `
<div class="card">
<h3>${p.nome}</h3>
<p>R$ ${p.preco}</p>
<p>Estoque ${p.estoque}</p>
</div>
`

adminLista.innerHTML += `
<div>${p.nome} - R$ ${p.preco}</div>
`

})

}

// 🔥 TEMPO REAL (APARECE PRA TODO MUNDO)
onSnapshot(produtosRef,(snapshot)=>{
renderProdutos(snapshot.docs)
})

</script>

</body>
</html>
